name: ifix_tech
description: "iFix - Home Services Technician App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Localization
  easy_localization: ^3.0.8

  # State Management
  flutter_bloc: ^9.1.1

  # Navigation
  go_router: ^15.1.2

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1

  # Utilities
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  equatable: ^2.0.7
  dartz: ^0.10.1
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^10.2.0
  geolocator: ^13.0.2
  web_socket_channel: ^3.0.1
  fl_chart: ^1.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
