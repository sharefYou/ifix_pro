name: ifix_client
description: "iFix - Home Services Client App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2
  easy_localization: ^3.0.8
  pretty_dio_logger: ^1.4.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/translations/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
